version: "3.8"

services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: traffic_dss
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 config.wsgi:application
    env_file:
      - .env.example
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  celery_worker:
    build: .
    command: celery -A config worker -l info
    env_file:
      - .env.example
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  celery_beat:
    build: .
    command: celery -A config beat -l info
    env_file:
      - .env.example
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
